# Tema i3 (estático; MaterialYou regenera via matugen — veja materialyou-set)
# Lido no i3 via: alacritty --config-file ~/.config/i3/alacritty/alacritty.toml
[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#4c566A"
blue = "#81A1C1"
cyan = "#7755AA"
green = "#A3BE8C"
magenta = "#B48EAD"
red = "#BF616A"
white = "#ECEFF4"
yellow = "#EBCB8B"

[colors.normal]
black = "#3b4252"
blue = "#81A1C1"
cyan = "#9977FF"
green = "#A3BE8C"
magenta = "#B48EAD"
red = "#BF616A"
white = "#E5E9F0"
yellow = "#EBCB8B"

[colors.primary]
background = "#060310"
foreground = "#f0E0ff"

[env]
LANG = "pt_BR.UTF-8"
LC_CTYPE = "pt_BR.UTF-8"
TERM = "alacritty"

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[window.padding]
x = 10
y = 10
