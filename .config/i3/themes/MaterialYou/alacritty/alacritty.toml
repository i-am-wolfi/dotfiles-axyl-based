# MaterialYou (matugen) — gerado de /home/Wolf/.config/i3/wallpaper.jpg source #4b6c8a
# Não edite à mão: ~/.config/i3/bin/materialyou-set
# Lido pelo i3 via: alacritty --config-file ~/.config/i3/alacritty/alacritty.toml
# (~/.config/alacritty/alacritty.toml do Hyprland fica intacto)
[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#8c9198"
blue = "#95cbff"
cyan = "#a9c7ea"
green = "#a9c7ea"
magenta = "#d1b2f4"
red = "#ffb4ab"
white = "#e0e2e8"
yellow = "#d1b2f4"

[colors.normal]
black = "#272a2e"
blue = "#95cbff"
cyan = "#a9c7ea"
green = "#a9c7ea"
magenta = "#d1b2f4"
red = "#ffb4ab"
white = "#e0e2e8"
yellow = "#d1b2f4"

[colors.primary]
background = "#101418"
foreground = "#e0e2e8"

[env]
LANG = "pt_BR.UTF-8"
LC_CTYPE = "pt_BR.UTF-8"
TERM = "alacritty"

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[window]
opacity = 0.5

[window.padding]
x = 10
y = 10
