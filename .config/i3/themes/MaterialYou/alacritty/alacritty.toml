# MaterialYou (matugen) — gerado de /home/Wolf/.config/i3/wallpaper.jpg source #020001
# Não edite à mão: ~/.config/i3/bin/materialyou-set
# Lido pelo i3 via: alacritty --config-file ~/.config/i3/alacritty/alacritty.toml
# (~/.config/alacritty/alacritty.toml do Hyprland fica intacto)
[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#9c8d93"
blue = "#fbb0d7"
cyan = "#dfbecc"
green = "#dfbecc"
magenta = "#f3ba9b"
red = "#ffb4ab"
white = "#eddfe3"
yellow = "#f3ba9b"

[colors.normal]
black = "#30282b"
blue = "#fbb0d7"
cyan = "#dfbecc"
green = "#dfbecc"
magenta = "#f3ba9b"
red = "#ffb4ab"
white = "#eddfe3"
yellow = "#f3ba9b"

[colors.primary]
background = "#181115"
foreground = "#eddfe3"

[env]
LANG = "pt_BR.UTF-8"
LC_CTYPE = "pt_BR.UTF-8"
TERM = "alacritty"

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[window.padding]
x = 10
y = 10
