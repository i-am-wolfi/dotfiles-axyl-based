# MaterialYou (matugen) — gerado de /home/Wolf/.config/i3/wallpaper.jpg source #ef1c2f
# Não edite à mão: ~/.config/i3/bin/materialyou-set
# Lido pelo i3 via: alacritty --config-file ~/.config/i3/alacritty/alacritty.toml
# (~/.config/alacritty/alacritty.toml do Hyprland fica intacto)
[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#a08c8a"
blue = "#ffb3ae"
cyan = "#e7bdb9"
green = "#e7bdb9"
magenta = "#e2c28c"
red = "#ffb4ab"
white = "#f1dedd"
yellow = "#e2c28c"

[colors.normal]
black = "#322827"
blue = "#ffb3ae"
cyan = "#e7bdb9"
green = "#e7bdb9"
magenta = "#e2c28c"
red = "#ffb4ab"
white = "#f1dedd"
yellow = "#e2c28c"

[colors.primary]
background = "#1a1111"
foreground = "#f1dedd"

[env]
LANG = "pt_BR.UTF-8"
LC_CTYPE = "pt_BR.UTF-8"
TERM = "alacritty"

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[window]
opacity = 0.5

[window.padding]
x = 10
y = 10
