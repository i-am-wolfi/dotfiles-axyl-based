# MaterialYou (matugen) — gerado de /home/Wolf/.config/i3/wallpaper.jpg source #7fa1df
# Não edite à mão: ~/.config/i3/bin/materialyou-set
# Lido pelo i3 via: alacritty --config-file ~/.config/i3/alacritty/alacritty.toml
# (~/.config/alacritty/alacritty.toml do Hyprland fica intacto)
[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#8e9099"
blue = "#aac7ff"
cyan = "#bec6dc"
green = "#bec6dc"
magenta = "#ddbce0"
red = "#ffb4ab"
white = "#e2e2e9"
yellow = "#ddbce0"

[colors.normal]
black = "#282a2f"
blue = "#aac7ff"
cyan = "#bec6dc"
green = "#bec6dc"
magenta = "#ddbce0"
red = "#ffb4ab"
white = "#e2e2e9"
yellow = "#ddbce0"

[colors.primary]
background = "#111318"
foreground = "#e2e2e9"

[env]
LANG = "pt_BR.UTF-8"
LC_CTYPE = "pt_BR.UTF-8"
TERM = "alacritty"

[font]
size = 10

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Medium"

[window]
opacity = 0.5

[window.padding]
x = 10
y = 10
